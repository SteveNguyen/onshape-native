<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Onshape Native</title>
<link rel="icon" type="image/png" href="icons/icon-32.png">
<style>
body{font:13px system-ui;margin:0;padding:16px;width:360px;background:#fff;color:#182523}.row{display:flex;align-items:center;gap:10px}#dot{width:7px;height:7px;border-radius:50%;background:#adb5b2}#dot.on{background:#247e61}#status,.grow{flex:1;min-width:0}button{border:1px solid #d9dedc;background:#fff;border-radius:6px;padding:6px 10px;color:inherit;font:inherit;cursor:pointer}section,details{border-top:1px solid #d9dedc;margin-top:12px;padding-top:10px}h2{font-size:11px;font-weight:600;color:#5d6b67;margin:0 0 6px;text-transform:uppercase}summary{cursor:pointer;font-weight:600}.muted{color:#5d6b67}.id{font:11px ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}ul{list-style:none;margin:0;padding:0}li{padding:6px 0}li+li{border-top:1px solid #eef1f0}label{display:flex;align-items:center;gap:6px;margin-top:4px}label.cb{display:inline-flex;margin:0}.warn{color:#8a4b00}.banner{background:#fff6e5;border:1px solid #f0d9a8;border-radius:6px;padding:8px;margin-top:8px}.banner .row{margin-top:6px;justify-content:flex-end}.folder{font-size:11px;font-weight:600;color:#5d6b67;margin-top:8px}.trow{padding:3px 4px;border-radius:4px}.trow.open{background:#e6f2ee}.small{font-size:11px}
</style>
<div class="row"><span id="dot"></span><span id="status" role="status">Disconnected</span><button id="toggle">Connect</button></div>
<section id="notice" class="warn" hidden></section>
<div id="banners"></div>
<section><h2>This tab</h2><div id="current" class="muted">No Onshape document in the active tab.</div></section>
<section id="presets" hidden></section>
<details id="custom" hidden><summary>Custom: choose tabs</summary><div id="customBody"></div></details>
<details id="actions" hidden><summary>Document actions</summary><div id="actionsBody"></div></details>
<section id="summarySection" hidden><h2>Access</h2><div id="summary"></div></section>
<details id="all"><summary>All authorized documents</summary><ul id="docs"></ul></details>
<section><label><input type="checkbox" id="untested"> Advanced: allow untested native commands</label>
<label><input type="checkbox" id="uifallback"> Advanced: allow UI fallback clicks</label>
<label><input type="checkbox" id="createdocs"> Advanced: allow creating new documents</label></section>
<script type="module" src="popup.js"></script></html>
